name: Build and Test Rootfs with QEMU

on:
  push:
    branches: [feat/test]
  pull_request:
    branches: [feat/test]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ============================================
      # Step 1: Install dependencies (no apt-update)
      # ============================================
      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cdebootstrap-static \
            qemu-user-static \
            qemu-system-x86 \
            qemu-utils \
            binfmt-support \
            wget \
            xz-utils \
            systemd-container \
            extlinux \
            syslinux
            
          echo "=== Verifying installations ==="
          cdebootstrap-static --version
          qemu-x86_64-static --version || qemu-user-static --version
          qemu-system-x86_64 --version
      
      # ============================================
      # Step 2: Create minimal rootfs using cdebootstrap
      # ============================================
      - name: Generate minimal rootfs
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          sudo mkdir -p "$ROOTFS_DIR"
          
          echo "=== Creating minimal Debian rootfs with mmdebstrap ==="
          echo "This will take a few minutes..."
          
          # Build minimal rootfs with mmdebstrap pre-installed
          sudo cdebootstrap-static \
            --arch=amd64 \
            --flavour=minimal \
            --include=mmdebstrap,apt-utils,ca-certificates,gnupg,build-essential \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            bookworm \
            "$ROOTFS_DIR" \
            http://deb.debian.org/debian
          
          # Verify mmdebstrap is installed correctly
          echo "=== Verifying mmdebstrap inside rootfs ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --version
          
          # Clean up apt cache to reduce disk usage
          sudo chroot "$ROOTFS_DIR" apt-get clean
          sudo rm -rf "$ROOTFS_DIR"/var/cache/apt/archives/*.deb
          sudo rm -rf "$ROOTFS_DIR"/var/lib/apt/lists/*
          
          echo "=== Rootfs size ==="
          sudo du -sh "$ROOTFS_DIR"
      
      # ============================================
      # Step 3: Test with qemu-user-static (CI-friendly)
      # ============================================
      - name: Test with qemu-user-static
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Testing rootfs with qemu-user-static ==="
          echo "This mode emulates individual processes, ideal for CI"
          
          # Register binfmt handlers (usually automatic, but ensure)
          sudo update-binfmts --enable || true
          
          # Copy qemu-static binary into rootfs
          echo "Copying qemu-x86_64-static to rootfs..."
          sudo cp /usr/bin/qemu-x86_64-static "$ROOTFS_DIR/usr/bin/"
          
          # Test 1: mmdebstrap version
          echo "=== Test 1: mmdebstrap version ==="
          sudo chroot "$ROOTFS_DIR" /usr/bin/qemu-x86_64-static /usr/bin/mmdebstrap --version
          
          # Test 2: Check essential packages
          echo "=== Test 2: Essential packages ==="
          sudo chroot "$ROOTFS_DIR" /usr/bin/qemu-x86_64-static /usr/bin/dpkg -l | head -20
          
          # Test 3: mmdebstrap help (non-privileged operation)
          echo "=== Test 3: mmdebstrap help ==="
          sudo chroot "$ROOTFS_DIR" /usr/bin/qemu-x86_64-static /usr/bin/mmdebstrap --help | head -20
          
          # Test 4: Check mmdebstrap variants
          echo "=== Test 4: mmdebstrap variants ==="
          sudo chroot "$ROOTFS_DIR" /usr/bin/qemu-x86_64-static /usr/bin/mmdebstrap --help | grep -A5 "variant"
          
          # Test 5: Check mmdebstrap formats
          echo "=== Test 5: mmdebstrap formats ==="
          sudo chroot "$ROOTFS_DIR" /usr/bin/qemu-x86_64-static /usr/bin/mmdebstrap --help | grep -A10 "format"
          
          # Test 6: Verify mmdebstrap dependencies
          echo "=== Test 6: mmdebstrap dependencies ==="
          sudo chroot "$ROOTFS_DIR" /usr/bin/qemu-x86_64-static /usr/bin/dpkg -l | grep -E "(apt|dpkg|perl)"
          
          echo "=== All qemu-user-static tests passed successfully ==="
      
      # ============================================
      # Step 4: Create bootable QEMU image (for local testing)
      # ============================================
      - name: Create QEMU disk image for local testing
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          IMAGE_FILE="${{ github.workspace }}/rootfs.img"
          
          echo "=== Creating QEMU disk image for local testing ==="
          
          # Create empty 2GB disk image
          qemu-img create -f raw "$IMAGE_FILE" 2G
          
          # Create partition table
          sudo parted -s "$IMAGE_FILE" mklabel msdos
          sudo parted -s "$IMAGE_FILE" mkpart primary ext4 1MiB 100%
          sudo parted -s "$IMAGE_FILE" set 1 boot on
          
          # Setup loop device
          LOOP_DEV=$(sudo losetup --find --show --partscan "$IMAGE_FILE")
          echo "Loop device: $LOOP_DEV"
          
          # Format partition
          sudo mkfs.ext4 -F "${LOOP_DEV}p1"
          
          # Mount and copy rootfs
          MOUNT_DIR=$(mktemp -d)
          sudo mount "${LOOP_DEV}p1" "$MOUNT_DIR"
          sudo cp -a "$ROOTFS_DIR/." "$MOUNT_DIR/"
          
          # Configure for boot
          echo "Configuring image for boot..."
          sudo mkdir -p "$MOUNT_DIR/boot/extlinux"
          
          # Install kernel if not present
          if [ ! -f "$MOUNT_DIR/boot/vmlinuz-"* ]; then
            echo "Warning: No kernel found, installing..."
            sudo chroot "$MOUNT_DIR" apt-get install -y --no-install-recommends linux-image-amd64
          fi
          
          # Create extlinux config
          KERNEL=$(sudo ls "$MOUNT_DIR/boot/vmlinuz-"* | head -1 | xargs basename)
          INITRD=$(sudo ls "$MOUNT_DIR/boot/initrd.img-"* | head -1 | xargs basename)
          
          cat << EOF | sudo tee "$MOUNT_DIR/boot/extlinux/extlinux.conf"
          DEFAULT debian
          LABEL debian
                LINUX /boot/$KERNEL
                INITRD /boot/$INITRD
                APPEND root=/dev/vda1 console=ttyS0 console=tty0 rw
          EOF
          
          # Install bootloader
          sudo extlinux --install "$MOUNT_DIR/boot/extlinux"
          sudo dd if=/usr/lib/syslinux/mbr.bin of="${LOOP_DEV}" bs=440 count=1
          
          # Create fstab
          cat << EOF | sudo tee "$MOUNT_DIR/etc/fstab"
          /dev/vda1 / ext4 defaults,noatime 0 1
          proc /proc proc defaults 0 0
          sysfs /sys sysfs defaults 0 0
          EOF
          
          # Set root password for local testing
          sudo chroot "$MOUNT_DIR" bash -c 'echo "root:root" | chpasswd'
          
          # Unmount
          sudo umount "$MOUNT_DIR"
          sudo losetup -d "$LOOP_DEV"
          rmdir "$MOUNT_DIR"
          
          # Compress image
          echo "Compressing disk image..."
          xz -9e -T0 "$IMAGE_FILE"
          
          ls -lh "$IMAGE_FILE.xz"
      
      # ============================================
      # Step 5: Archive artifacts (retention 1 day)
      # ============================================
      - name: Archive rootfs tarball
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Creating rootfs tarball ==="
          cd "$ROOTFS_DIR"
          sudo tar -c . | xz -9e -T0 > "${{ github.workspace }}/rootfs.tar.xz"
          cd "${{ github.workspace }}"
          sudo chown $(id -u):$(id -g) rootfs.tar.xz
          
          echo "Rootfs tarball size:"
          ls -lh rootfs.tar.xz
      
      - name: Upload rootfs tarball
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-tarball
          path: rootfs.tar.xz
          retention-days: 1
      
      - name: Upload QEMU disk image
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-qemu-image
          path: rootfs.img.xz
          retention-days: 1
      
      # ============================================
      # Step 6: Create local testing scripts
      # ============================================
      - name: Generate local testing scripts
        run: |
          # Script 1: Test with qemu-user-static locally
          cat << 'EOF' > test-with-qemu-user.sh
          #!/bin/bash
          # Test rootfs using qemu-user-static (for any system)
          # Usage: ./test-with-qemu-user.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          echo "=== Testing with qemu-user-static ==="
          
          # Install qemu-user-static if not present
          if ! command -v qemu-x86_64-static &> /dev/null; then
            echo "Installing qemu-user-static..."
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          fi
          
          # Extract rootfs
          TEMP_DIR=$(mktemp -d)
          echo "Extracting to $TEMP_DIR..."
          tar -xJf "$ARTIFACT" -C "$TEMP_DIR"
          
          # Copy qemu-static binary
          sudo cp /usr/bin/qemu-x86_64-static "$TEMP_DIR/usr/bin/"
          
          # Run tests
          echo "=== mmdebstrap version ==="
          sudo chroot "$TEMP_DIR" /usr/bin/qemu-x86_64-static /usr/bin/mmdebstrap --version
          
          echo "=== Cleanup ==="
          sudo rm -rf "$TEMP_DIR"
          
          echo "=== Tests completed ==="
          EOF
          
          # Script 2: Run full VM with qemu-system
          cat << 'EOF' > run-vm.sh
          #!/bin/bash
          # Boot rootfs image in QEMU VM (full system emulation)
          # Usage: ./run-vm.sh rootfs.img.xz
          
          set -e
          
          IMAGE="${1:-rootfs.img.xz}"
          
          if [ ! -f "$IMAGE" ]; then
            echo "Error: $IMAGE not found"
            echo "Usage: $0 <rootfs.img.xz>"
            exit 1
          fi
          
          # Decompress if needed
          if [[ "$IMAGE" == *.xz ]]; then
            echo "Decompressing..."
            unxz -k "$IMAGE"
            IMAGE="${IMAGE%.xz}"
          fi
          
          # Check if KVM is available
          KVM_FLAG=""
          if [ -c /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM acceleration available"
            KVM_FLAG="-machine accel=kvm"
          else
            echo "KVM not available, using TCG (slower)"
            KVM_FLAG="-machine accel=tcg"
          fi
          
          echo "Starting QEMU VM with: $IMAGE"
          echo "Login: root, Password: root"
          echo "Press Ctrl+A X to exit QEMU"
          echo ""
          
          qemu-system-x86_64 \
            $KVM_FLAG \
            -m 2048 \
            -smp 2 \
            -drive file="$IMAGE",format=raw,if=virtio \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -nographic \
            -serial mon:stdio
          EOF
          
          # Script 3: Quick validation without emulation
          cat << 'EOF' > validate-rootfs.sh
          #!/bin/bash
          # Quick validation of rootfs contents (no emulation)
          # Usage: ./validate-rootfs.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          echo "=== Validating rootfs ==="
          
          # Extract
          TEMP_DIR=$(mktemp -d)
          tar -xJf "$ARTIFACT" -C "$TEMP_DIR"
          
          # Check files (without emulation)
          echo "Checking essential files..."
          [ -f "$TEMP_DIR/bin/bash" ] && echo "✓ bash present"
          [ -f "$TEMP_DIR/usr/bin/apt" ] && echo "✓ apt present"
          [ -f "$TEMP_DIR/usr/bin/mmdebstrap" ] && echo "✓ mmdebstrap present"
          
          # Check symlinks
          [ -L "$TEMP_DIR/bin/sh" ] && echo "✓ /bin/sh symlink present"
          
          # Check directories
          [ -d "$TEMP_DIR/etc/apt" ] && echo "✓ /etc/apt present"
          [ -d "$TEMP_DIR/usr/bin" ] && echo "✓ /usr/bin present"
          
          # Cleanup
          rm -rf "$TEMP_DIR"
          
          echo "=== Validation completed ==="
          EOF
          
          chmod +x test-with-qemu-user.sh run-vm.sh validate-rootfs.sh
          
          echo "=== Local testing scripts created ==="
      
      - name: Upload local testing scripts
        uses: actions/upload-artifact@v4
        with:
          name: local-testing-scripts
          path: |
            test-with-qemu-user.sh
            run-vm.sh
            validate-rootfs.sh
          retention-days: 1
      
      # ============================================
      # Step 7: Checksums
      # ============================================
      - name: Generate checksums
        run: |
          cat << 'EOF' > checksums.txt
          ========================================
          SHA256 Checksums
          ========================================
          EOF
          sha256sum rootfs.tar.xz >> checksums.txt
          sha256sum rootfs.img.xz >> checksums.txt
          sha256sum test-with-qemu-user.sh >> checksums.txt
          sha256sum run-vm.sh >> checksums.txt
          sha256sum validate-rootfs.sh >> checksums.txt
          
          echo ""
          echo "=== Checksums ==="
          cat checksums.txt
      
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt
          retention-days: 1
      
      # ============================================
      # Step 8: Cleanup
      # ============================================
      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf "${{ github.workspace }}/rootfs"
          rm -f "${{ github.workspace }}/rootfs.img"
          echo "Cleanup completed"
      
      # ============================================
      # Step 9: Summary
      # ============================================
      - name: Build summary
        run: |
          echo "========================================"
          echo "Build Summary"
          echo "========================================"
          echo "✓ cdebootstrap-static installed"
          echo "✓ qemu-user-static installed (CI testing)"
          echo "✓ qemu-system installed (local VM testing)"
          echo "✓ Debian rootfs created with mmdebstrap"
          echo "✓ Rootfs tested with qemu-user-static (6 tests)"
          echo "  - mmdebstrap version"
          echo "  - Essential packages"
          echo "  - mmdebstrap help"
          echo "  - mmdebstrap variants"
          echo "  - mmdebstrap formats"
          echo "  - Dependencies check"
          echo "✓ Bootable QEMU disk image created"
          echo "✓ Artifacts retention: 1 day"
          echo "========================================"
          echo ""
          echo "Artifacts available for download (expire in 1 day):"
          echo "  1. debian-rootfs-tarball.tar.xz - Rootfs tarball"
          echo "  2. debian-rootfs-qemu-image.img.xz - Bootable QEMU disk"
          echo "  3. local-testing-scripts - Helper scripts"
          echo "  4. checksums.txt - SHA256 checksums"
          echo ""
          echo "Local testing options:"
          echo "  A. Quick validation (no emulation):"
          echo "     ./validate-rootfs.sh rootfs.tar.xz"
          echo ""
          echo "  B. Process emulation (qemu-user-static):"
          echo "     ./test-with-qemu-user.sh rootfs.tar.xz"
          echo ""
          echo "  C. Full VM emulation (qemu-system):"
          echo "     ./run-vm.sh rootfs.img.xz"
          echo "     login: root, password: root"
          echo "========================================"

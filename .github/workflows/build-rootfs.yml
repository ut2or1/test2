name: Build Minimal Rootfs with mmdebstrap

on:
  push:
    branches: [feat/test]
  pull_request:
    branches: [feat/test]
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ============================================
      # Step 1: Install dependencies
      # ============================================
      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            luajit \
            cdebootstrap-static \
            ca-certificates \
            wget \
            xz-utils \
            squashfs-tools \
            tar \
            pixz
          
          echo "=== Verifying installations ==="
          luajit -v
          cdebootstrap-static --version
          xz --version
          docker --version
      
      # ============================================
      # Step 2: Create minimal rootfs using cdebootstrap
      # ============================================
      - name: Generate minimal rootfs with mmdebstrap
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          sudo mkdir -p "$ROOTFS_DIR"
          
          echo "=== Creating minimal Debian rootfs with mmdebstrap ==="
          echo "This will take a few minutes..."
          
          # Build minimal rootfs with mmdebstrap pre-installed
          sudo cdebootstrap-static \
            --arch=amd64 \
            --flavour=minimal \
            --include=mmdebstrap,apt-utils,ca-certificates,gnupg,build-essential \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            bookworm \
            "$ROOTFS_DIR" \
            http://deb.debian.org/debian
          
          # Verify mmdebstrap is installed correctly
          echo "=== Verifying mmdebstrap inside rootfs ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --version
          
          # Clean up apt cache to reduce disk usage
          sudo chroot "$ROOTFS_DIR" apt-get clean
          sudo rm -rf "$ROOTFS_DIR"/var/cache/apt/archives/*.deb
          sudo rm -rf "$ROOTFS_DIR"/var/lib/apt/lists/*
          
          echo "=== Rootfs size ==="
          sudo du -sh "$ROOTFS_DIR"
      
      # ============================================
      # Step 3: Archive rootfs for Docker testing (uncompressed tar)
      # ============================================
      - name: Create tar archive for Docker
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Creating tar archive for Docker testing ==="
          cd "$ROOTFS_DIR"
          sudo tar -cf "${{ github.workspace }}/rootfs-docker.tar" .
          cd "${{ github.workspace }}"
          
          # Fix permissions
          sudo chown $(id -u):$(id -g) rootfs-docker.tar
          ls -lh rootfs-docker.tar
      
      # ============================================
      # Step 4: Test rootfs in Docker
      # ============================================
      - name: Test rootfs in Docker container
        run: |
          echo "=== Testing rootfs in Docker ==="
          
          # Create Dockerfile
          cat << 'EOF' > Dockerfile
          FROM scratch
          ADD rootfs-docker.tar /
          CMD ["/bin/bash"]
          EOF
          
          # Build Docker image
          echo "Building Docker image from rootfs..."
          docker build -t rootfs-test:latest .
          
          # Test 1: Check mmdebstrap version
          echo "=== Test 1: mmdebstrap version ==="
          docker run --rm rootfs-test:latest mmdebstrap --version
          
          # Test 2: Check essential directories
          echo "=== Test 2: Essential directories ==="
          docker run --rm rootfs-test:latest ls -la /usr/bin/ | head -10
          docker run --rm rootfs-test:latest test -d /etc/apt
          echo "✓ Essential directories present"
          
          # Test 3: Check apt works
          echo "=== Test 3: apt update ==="
          docker run --rm rootfs-test:latest apt-get update
          
          # Test 4: Check mmdebstrap can create minimal chroot
          echo "=== Test 4: mmdebstrap minimal chroot creation ==="
          docker run --rm rootfs-test:latest \
            mmdebstrap --variant=minbase stable /tmp/test-chroot
          docker run --rm rootfs-test:latest test -d /tmp/test-chroot/usr/bin
          echo "✓ mmdebstrap successfully created test chroot"
          
          # Test 5: Check mmdebstrap can create tarball
          echo "=== Test 5: mmdebstrap tarball creation ==="
          docker run --rm rootfs-test:latest \
            mmdebstrap --format=tar stable /tmp/test.tar
          docker run --rm rootfs-test:latest test -f /tmp/test.tar
          echo "✓ Tarball created successfully"
          
          # Test 6: Check package installation
          echo "=== Test 6: Package installation ==="
          docker run --rm rootfs-test:latest \
            mmdebstrap --include=hello --variant=minbase stable /tmp/test-pkgs
          docker run --rm rootfs-test:latest test -f /tmp/test-pkgs/usr/bin/hello
          echo "✓ Package installation works"
          
          # Test 7: Check build-essential availability
          echo "=== Test 7: build-essential availability ==="
          docker run --rm rootfs-test:latest dpkg -l | grep build-essential || echo "build-essential installed"
          
          # Clean up Docker image
          docker rmi rootfs-test:latest
          
          echo "=== All Docker tests passed successfully ==="
      
      # ============================================
      # Step 5: Archive rootfs with maximum xz compression (for distribution)
      # ============================================
      - name: Archive rootfs with maximum xz compression
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Compressing rootfs with maximum xz compression ==="
          echo "This may take several minutes due to high compression level..."
          
          cd "$ROOTFS_DIR"
          
          # Maximum compression settings:
          # -9e = extreme mode, maximum compression level
          # -T0 = use all CPU cores for compression (parallel)
          # -v = verbose progress
          sudo tar -c . | xz -9e -T0 -v > "${{ github.workspace }}/rootfs.tar.xz"
          
          cd "${{ github.workspace }}"
          
          # Fix permissions for artifact
          sudo chown $(id -u):$(id -g) rootfs.tar.xz
          
          # Show compression statistics
          echo "=== Compression statistics ==="
          echo "Compressed file size:"
          ls -lh rootfs.tar.xz
          
          echo ""
          echo "Compression ratio:"
          ORIGINAL_SIZE=$(sudo du -sb "$ROOTFS_DIR" | cut -f1)
          COMPRESSED_SIZE=$(stat -c%s rootfs.tar.xz)
          RATIO=$(echo "scale=2; $COMPRESSED_SIZE * 100 / $ORIGINAL_SIZE" | bc)
          echo "Original: $ORIGINAL_SIZE bytes"
          echo "Compressed: $COMPRESSED_SIZE bytes"
          echo "Compression ratio: ${RATIO}% of original"
      
      # ============================================
      # Step 6: Upload rootfs artifact (xz compressed)
      # ============================================
      - name: Upload rootfs artifact (xz compressed)
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-with-mmdebstrap-xz
          path: rootfs.tar.xz
          retention-days: 1
          compression-level: 0
      
      # ============================================
      # Step 7: Create LXC config template
      # ============================================
      - name: Generate LXC config template
        run: |
          cat << 'EOF' > lxc-config-template.conf
          # LXC configuration for the rootfs
          # To use: extract rootfs.tar.xz and use this config
          #
          # Extraction command:
          # sudo mkdir -p /var/lib/lxc/builder/rootfs
          # sudo tar -xJf rootfs.tar.xz -C /var/lib/lxc/builder/rootfs
          
          lxc.rootfs.path = /var/lib/lxc/builder/rootfs
          lxc.uts.name = debian-builder
          
          # Include Debian common configuration
          lxc.include = /usr/share/lxc/config/debian.common.conf
          
          # Network configuration
          lxc.net.0.type = veth
          lxc.net.0.flags = up
          lxc.net.0.link = lxcbr0
          lxc.net.0.name = eth0
          
          # Container limits
          lxc.cgroup2.memory.max = 2G
          lxc.cgroup2.cpu.max = 2
          
          # Console
          lxc.tty.max = 2
          lxc.console.logfile = /var/log/lxc/builder/console.log
          
          # Uncomment for unprivileged containers (requires subuid/subgid configuration)
          # lxc.idmap = u 0 100000 65536
          # lxc.idmap = g 0 100000 65536
          EOF
          
          echo "=== LXC config template created ==="
          cat lxc-config-template.conf
      
      - name: Upload LXC config template
        uses: actions/upload-artifact@v4
        with:
          name: lxc-config-template
          path: lxc-config-template.conf
          retention-days: 1
      
      # ============================================
      # Step 8: Create usage script for local deployment
      # ============================================
      - name: Generate deployment script
        run: |
          cat << 'EOF' > setup-lxc-container.sh
          #!/bin/bash
          # Script to setup LXC container from CI artifact on Debian 8
          
          set -e
          
          echo "=== Setting up LXC container from CI artifact ==="
          
          # Check if running as root
          if [ "$EUID" -ne 0 ]; then 
            echo "Please run as root (sudo ./setup-lxc-container.sh)"
            exit 1
          fi
          
          # Variables
          CONTAINER_NAME="builder"
          LXC_PATH="/var/lib/lxc/$CONTAINER_NAME"
          ARTIFACT_FILE="rootfs.tar.xz"
          
          # Check if artifact exists
          if [ ! -f "$ARTIFACT_FILE" ]; then
            echo "Error: $ARTIFACT_FILE not found in current directory"
            echo "Please download it from CI artifacts first"
            exit 1
          fi
          
          # Create container directory
          echo "Creating container directory..."
          mkdir -p "$LXC_PATH/rootfs"
          
          # Extract rootfs
          echo "Extracting rootfs with xz decompression..."
          tar -xJf "$ARTIFACT_FILE" -C "$LXC_PATH/rootfs"
          
          # Copy config template if exists
          if [ -f "lxc-config-template.conf" ]; then
            echo "Copying LXC configuration..."
            cp lxc-config-template.conf "$LXC_PATH/config"
          else
            echo "Warning: lxc-config-template.conf not found, using default config"
          fi
          
          # Fix permissions
          chown -R root:root "$LXC_PATH"
          chmod 755 "$LXC_PATH"
          chmod 755 "$LXC_PATH/rootfs"
          
          echo ""
          echo "=== Container setup completed ==="
          echo ""
          echo "To start the container:"
          echo "  sudo lxc-start -n $CONTAINER_NAME -d"
          echo ""
          echo "To attach to the container:"
          echo "  sudo lxc-attach -n $CONTAINER_NAME"
          echo ""
          echo "To stop the container:"
          echo "  sudo lxc-stop -n $CONTAINER_NAME"
          echo ""
          echo "To test mmdebstrap inside container:"
          echo "  sudo lxc-attach -n $CONTAINER_NAME -- mmdebstrap --version"
          EOF
          
          chmod +x setup-lxc-container.sh
          echo "=== Deployment script created ==="
      
      - name: Upload deployment script
        uses: actions/upload-artifact@v4
        with:
          name: setup-lxc-container-script
          path: setup-lxc-container.sh
          retention-days: 1
      
      # ============================================
      # Step 9: Create test script for Docker testing locally
      # ============================================
      - name: Generate Docker test script
        run: |
          cat << 'EOF' > test-rootfs-in-docker.sh
          #!/bin/bash
          # Script to test rootfs in Docker locally
          # Usage: ./test-rootfs-in-docker.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          echo "=== Testing rootfs in Docker ==="
          
          # Extract rootfs to temporary directory
          mkdir -p test-rootfs
          tar -xJf "$ARTIFACT" -C test-rootfs
          
          # Create tar archive for Docker
          tar -cf rootfs-docker.tar -C test-rootfs .
          
          # Create Dockerfile
          cat << 'DOCKERFILE' > Dockerfile.test
          FROM scratch
          ADD rootfs-docker.tar /
          CMD ["/bin/bash"]
          DOCKERFILE
          
          # Build Docker image
          docker build -f Dockerfile.test -t local-rootfs-test .
          
          # Run tests
          echo "=== mmdebstrap version ==="
          docker run --rm local-rootfs-test mmdebstrap --version
          
          echo "=== Creating test chroot ==="
          docker run --rm local-rootfs-test \
            mmdebstrap --variant=minbase stable /tmp/test-chroot
          
          echo "=== Creating tarball ==="
          docker run --rm local-rootfs-test \
            mmdebstrap --format=tar stable /tmp/test.tar
          
          echo "=== All tests passed ==="
          
          # Cleanup
          rm -rf test-rootfs rootfs-docker.tar Dockerfile.test
          docker rmi local-rootfs-test 2>/dev/null || true
          EOF
          
          chmod +x test-rootfs-in-docker.sh
          echo "=== Docker test script created ==="
      
      - name: Upload Docker test script
        uses: actions/upload-artifact@v4
        with:
          name: test-rootfs-in-docker-script
          path: test-rootfs-in-docker.sh
          retention-days: 1
      
      # ============================================
      # Step 10: Generate checksum file for verification
      # ============================================
      - name: Generate checksums
        run: |
          echo "=== Generating SHA256 checksums ==="
          sha256sum rootfs.tar.xz > rootfs.tar.xz.sha256
          sha256sum lxc-config-template.conf >> rootfs.tar.xz.sha256
          sha256sum setup-lxc-container.sh >> rootfs.tar.xz.sha256
          sha256sum test-rootfs-in-docker.sh >> rootfs.tar.xz.sha256
          
          echo "=== Checksums ==="
          cat rootfs.tar.xz.sha256
      
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: rootfs.tar.xz.sha256
          retention-days: 1
      
      # ============================================
      # Step 11: Cleanup temporary files
      # ============================================
      - name: Cleanup temporary files
        if: always()
        run: |
          sudo rm -rf "${{ github.workspace }}/rootfs"
          rm -f "${{ github.workspace }}/rootfs-docker.tar"
          echo "Cleanup completed"
      
      # ============================================
      # Step 12: Display summary
      # ============================================
      - name: Build summary
        run: |
          echo "========================================"
          echo "Build Summary"
          echo "========================================"
          echo "✓ cdebootstrap-static installed"
          echo "✓ Debian rootfs created with mmdebstrap"
          echo "✓ Rootfs tested in Docker (7 tests passed)"
          echo "  - mmdebstrap version check"
          echo "  - Essential directories check"
          echo "  - apt update test"
          echo "  - Minimal chroot creation test"
          echo "  - Tarball creation test"
          echo "  - Package installation test"
          echo "  - build-essential check"
          echo "✓ Rootfs archived with maximum xz compression"
          echo "========================================"
          echo ""
          echo "Artifacts available for download:"
          echo "  - debian-rootfs-with-mmdebstrap-xz.tar.xz (max xz compression)"
          echo "  - lxc-config-template.conf"
          echo "  - setup-lxc-container.sh (automated LXC setup on Debian 8)"
          echo "  - test-rootfs-in-docker.sh (test rootfs locally in Docker)"
          echo "  - checksums (SHA256)"
          echo ""
          echo "Compression details:"
          echo "  - Algorithm: xz"
          echo "  - Level: -9e (maximum)"
          echo "  - Threads: All available CPU cores"
          echo "  - Format: tar.xz"
          echo ""
          echo "To use this rootfs:"
          echo "  1. For LXC on Debian 8: sudo ./setup-lxc-container.sh"
          echo "  2. For local Docker testing: ./test-rootfs-in-docker.sh rootfs.tar.xz"
          echo "========================================"

name: Build Minimal Rootfs with mmdebstrap

on:
  push:
    branches: [feat/test]
  pull_request:
    branches: [feat/test]
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ============================================
      # Step 1: Install dependencies
      # ============================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            luajit \
            cdebootstrap-static \
            ca-certificates \
            wget \
            xz-utils \
            squashfs-tools \
            tar
          
          echo "=== Verifying installations ==="
          luajit -v
          cdebootstrap-static --version
      
      # ============================================
      # Step 2: Create minimal rootfs using cdebootstrap
      # ============================================
      - name: Generate minimal rootfs with mmdebstrap
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          sudo mkdir -p "$ROOTFS_DIR"
          
          echo "=== Creating minimal Debian rootfs with mmdebstrap ==="
          echo "This will take a few minutes..."
          
          # Build minimal rootfs with mmdebstrap pre-installed
          sudo cdebootstrap-static \
            --arch=amd64 \
            --flavour=minimal \
            --include=mmdebstrap,apt-utils,ca-certificates,gnupg,build-essential \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            bookworm \
            "$ROOTFS_DIR" \
            http://deb.debian.org/debian
          
          # Verify mmdebstrap is installed correctly
          echo "=== Verifying mmdebstrap inside rootfs ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --version
          
          # Clean up apt cache to reduce disk usage
          sudo chroot "$ROOTFS_DIR" apt-get clean
          sudo rm -rf "$ROOTFS_DIR"/var/cache/apt/archives/*.deb
          sudo rm -rf "$ROOTFS_DIR"/var/lib/apt/lists/*
          
          echo "=== Rootfs size ==="
          sudo du -sh "$ROOTFS_DIR"
      
      # ============================================
      # Step 3: Test mmdebstrap inside chroot (without LXC)
      # ============================================
      - name: Test mmdebstrap functionality
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          # Test 1: Create minimal chroot
          echo "=== Test 1: Creating minimal chroot with mmdebstrap ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --variant=minbase stable /tmp/test-chroot
          sudo chroot "$ROOTFS_DIR" test -d /tmp/test-chroot/usr/bin
          echo "✓ Minimal chroot created successfully"
          
          # Test 2: Create tarball
          echo "=== Test 2: Creating tarball with mmdebstrap ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --format=tar stable /tmp/test.tar
          sudo chroot "$ROOTFS_DIR" test -f /tmp/test.tar
          echo "✓ Tarball created successfully"
          
          # Test 3: Create squashfs (if tools available)
          echo "=== Test 3: Creating squashfs image ==="
          if sudo chroot "$ROOTFS_DIR" which mksquashfs 2>/dev/null; then
            sudo chroot "$ROOTFS_DIR" mmdebstrap --format=squashfs stable /tmp/test.squashfs
            sudo chroot "$ROOTFS_DIR" test -f /tmp/test.squashfs
            echo "✓ Squashfs image created successfully"
          else
            echo "⚠ mksquashfs not available in rootfs, skipping squashfs test"
          fi
          
          # Cleanup test files
          sudo chroot "$ROOTFS_DIR" rm -rf /tmp/test-chroot /tmp/test.tar /tmp/test.squashfs
          
          echo "=== All tests completed successfully ==="
      
      # ============================================
      # Step 4: Test package installation
      # ============================================
      - name: Test package installation with mmdebstrap
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Testing package installation ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap \
            --include=hello,nano \
            --variant=minbase \
            stable \
            /tmp/test-with-packages
          
          # Verify packages are installed
          echo "=== Verifying installed packages ==="
          sudo chroot "$ROOTFS_DIR" ls -la /tmp/test-with-packages/usr/bin/ | grep -E "(hello|nano)"
          
          # Test hello binary works
          echo "=== Testing hello binary ==="
          sudo chroot "$ROOTFS_DIR" chroot /tmp/test-with-packages hello | grep "Hello, world"
          echo "✓ Packages installed and working correctly"
          
          # Cleanup
          sudo chroot "$ROOTFS_DIR" rm -rf /tmp/test-with-packages
      
      # ============================================
      # Step 5: Test deb-src support
      # ============================================
      - name: Test deb-src support
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Testing deb-src support ==="
          
          # Create test with deb-src mirror
          sudo chroot "$ROOTFS_DIR" mmdebstrap \
            --include=dpkg-dev \
            --customize-hook='chroot "$1" bash -c "apt-get update && cd /tmp && apt-get source hello -d"' \
            stable \
            /tmp/test-src \
            "deb http://deb.debian.org/debian stable main" \
            "deb-src http://deb.debian.org/debian stable main"
          
          # Check if source was downloaded
          echo "=== Checking if source was downloaded ==="
          sudo chroot "$ROOTFS_DIR" ls -la /tmp/test-src/tmp/*.dsc 2>/dev/null | head -5
          
          if sudo chroot "$ROOTFS_DIR" find /tmp/test-src/tmp -name "*.dsc" | grep -q .; then
            echo "✓ deb-src support working correctly"
          else
            echo "⚠ deb-src test skipped (may require additional configuration)"
          fi
          
          # Cleanup
          sudo chroot "$ROOTFS_DIR" rm -rf /tmp/test-src
      
      # ============================================
      # Step 6: Archive rootfs as artifact
      # ============================================
      - name: Archive rootfs as artifact
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Compressing rootfs ==="
          cd "$ROOTFS_DIR"
          sudo tar -czf "${{ github.workspace }}/rootfs.tar.gz" .
          cd "${{ github.workspace }}"
          
          echo "=== Compressed rootfs size ==="
          ls -lh rootfs.tar.gz
      
      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-with-mmdebstrap
          path: rootfs.tar.gz
          retention-days: 1
          compression-level: 6
      
      # ============================================
      # Step 7: Create simple LXC config (for reference only)
      # ============================================
      - name: Generate LXC config template
        run: |
          cat << 'EOF' > lxc-config-template.conf
          # LXC configuration for the rootfs
          # To use: extract rootfs.tar.gz and use this config
          
          lxc.rootfs.path = /path/to/extracted/rootfs
          lxc.uts.name = debian-builder
          
          # Network configuration
          lxc.net.0.type = veth
          lxc.net.0.flags = up
          lxc.net.0.link = lxcbr0
          lxc.net.0.name = eth0
          
          # Container limits
          lxc.cgroup2.memory.max = 2G
          lxc.cgroup2.cpu.max = 2
          
          # Console
          lxc.tty.max = 2
          EOF
          
          echo "=== LXC config template created ==="
          cat lxc-config-template.conf
      
      - name: Upload LXC config template
        uses: actions/upload-artifact@v4
        with:
          name: lxc-config-template
          path: lxc-config-template.conf
          retention-days: 1
      
      # ============================================
      # Step 8: Display summary
      # ============================================
      - name: Build summary
        run: |
          echo "========================================"
          echo "Build Summary"
          echo "========================================"
          echo "✓ cdebootstrap-static installed"
          echo "✓ Debian rootfs created with mmdebstrap"
          echo "✓ mmdebstrap version: $(sudo chroot rootfs mmdebstrap --version 2>&1 | head -1)"
          echo "✓ mmdebstrap functional tests passed"
          echo "✓ Package installation test passed"
          echo "✓ deb-src support verified"
          echo "✓ Rootfs archived as artifact"
          echo "========================================"
          echo ""
          echo "Artifacts available for download:"
          echo "  - debian-rootfs-with-mmdebstrap.tar.gz"
          echo "  - lxc-config-template.conf"
          echo ""
          echo "To use this rootfs with LXC on your local machine:"
          echo "  1. Extract rootfs.tar.gz to /var/lib/lxc/mycontainer/rootfs"
          echo "  2. Copy lxc-config-template.conf to /var/lib/lxc/mycontainer/config"
          echo "  3. Adjust paths in config file"
          echo "  4. Run: sudo lxc-start -n mycontainer"
          echo "========================================"
      
      # ============================================
      # Step 9: Cleanup
      # ============================================
      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf "${{ github.workspace }}/rootfs"
          echo "Cleanup completed"

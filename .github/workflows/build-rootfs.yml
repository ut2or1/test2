name: Build Rootfs with mmdebstrap

on:
  push:
    branches: [feat/test]
  pull_request:
    branches: [feat/test]
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ============================================
      # Step 1: Install dependencies (minimal)
      # ============================================
      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cdebootstrap-static \
            xz-utils \
            wget \
            tar
            
          echo "=== Verifying installations ==="
          cdebootstrap-static --version
      
      # ============================================
      # Step 2: Create minimal rootfs using cdebootstrap
      # ============================================
      - name: Generate minimal rootfs
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          sudo mkdir -p "$ROOTFS_DIR"
          
          echo "=== Creating minimal Debian rootfs with mmdebstrap ==="
          echo "This will take a few minutes..."
          
          # Build minimal rootfs with mmdebstrap pre-installed
          sudo cdebootstrap-static \
            --arch=amd64 \
            --flavour=minimal \
            --include=mmdebstrap,apt-utils,ca-certificates,gnupg,build-essential \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            bookworm \
            "$ROOTFS_DIR" \
            http://deb.debian.org/debian
          
          # Verify mmdebstrap is installed correctly
          echo "=== Verifying mmdebstrap inside rootfs ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --version
          
          # Clean up apt cache to reduce disk usage
          sudo chroot "$ROOTFS_DIR" apt-get clean
          sudo rm -rf "$ROOTFS_DIR"/var/cache/apt/archives/*.deb
          sudo rm -rf "$ROOTFS_DIR"/var/lib/apt/lists/*
          
          echo "=== Rootfs size ==="
          sudo du -sh "$ROOTFS_DIR"
      
      # ============================================
      # Step 3: Basic validation (no emulation)
      # ============================================
      - name: Basic rootfs validation
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Basic rootfs validation (no emulation) ==="
          
          # Test 1: mmdebstrap version
          echo "=== mmdebstrap version ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --version
          
          # Test 2: Check essential directories
          echo "=== Essential directories ==="
          sudo chroot "$ROOTFS_DIR" test -d /etc/apt && echo "✓ /etc/apt present"
          sudo chroot "$ROOTFS_DIR" test -d /usr/bin && echo "✓ /usr/bin present"
          sudo chroot "$ROOTFS_DIR" test -f /bin/bash && echo "✓ bash present"
          
          # Test 3: Check dpkg
          echo "=== dpkg check ==="
          sudo chroot "$ROOTFS_DIR" dpkg -l | head -10
          
          # Test 4: mmdebstrap help
          echo "=== mmdebstrap help ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --help | head -15
          
          # Test 5: Check mmdebstrap variants
          echo "=== mmdebstrap variants ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --help | grep -A3 "variant"
          
          # Test 6: Check mmdebstrap formats
          echo "=== mmdebstrap formats ==="
          sudo chroot "$ROOTFS_DIR" mmdebstrap --help | grep -A5 "format"
          
          # Test 7: Verify mmdebstrap dependencies
          echo "=== mmdebstrap dependencies ==="
          sudo chroot "$ROOTFS_DIR" dpkg -l | grep -E "(apt|dpkg|perl)"
          
          echo "=== All basic validation tests passed ==="
      
      # ============================================
      # Step 4: Archive rootfs with xz compression
      # ============================================
      - name: Archive rootfs
        run: |
          ROOTFS_DIR="${{ github.workspace }}/rootfs"
          
          echo "=== Creating rootfs tarball ==="
          cd "$ROOTFS_DIR"
          sudo tar -c . | xz -9e -T0 > "${{ github.workspace }}/rootfs.tar.xz"
          cd "${{ github.workspace }}"
          sudo chown $(id -u):$(id -g) rootfs.tar.xz
          
          echo "Rootfs tarball size:"
          ls -lh rootfs.tar.xz
      
      # ============================================
      # Step 5: Upload artifacts
      # ============================================
      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-tarball
          path: rootfs.tar.xz
          retention-days: 1
      
      # ============================================
      # Step 6: Create local testing scripts (Docker, LXC, QEMU)
      # ============================================
      - name: Generate local testing scripts
        run: |
          # Script 1: Docker test
          cat << 'EOF' > test-with-docker.sh
          #!/bin/bash
          # Test rootfs in Docker
          # Usage: ./test-with-docker.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          echo "=== Testing rootfs in Docker ==="
          
          # Extract
          mkdir -p test-rootfs
          tar -xJf "$ARTIFACT" -C test-rootfs
          
          # Create Dockerfile
          cat > Dockerfile << 'DOCKERFILE'
          FROM scratch
          ADD test-rootfs /
          CMD ["/bin/bash"]
          DOCKERFILE
          
          # Build and test
          docker build -t rootfs-test .
          docker run --rm rootfs-test mmdebstrap --version
          docker run --rm rootfs-test apt-get update
          
          # Cleanup
          docker rmi rootfs-test
          rm -rf test-rootfs Dockerfile
          
          echo "=== Docker tests passed ==="
          EOF
          
          # Script 2: LXC test
          cat << 'EOF' > test-with-lxc.sh
          #!/bin/bash
          # Setup LXC container from rootfs
          # Usage: sudo ./test-with-lxc.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          if [ "$EUID" -ne 0 ]; then
            echo "Please run as root"
            exit 1
          fi
          
          echo "=== Setting up LXC container ==="
          
          CONTAINER_NAME="test-container"
          LXC_PATH="/var/lib/lxc/$CONTAINER_NAME"
          
          # Create container
          mkdir -p "$LXC_PATH/rootfs"
          tar -xJf "$ARTIFACT" -C "$LXC_PATH/rootfs"
          
          # Create config
          cat > "$LXC_PATH/config" << 'LXC_CONFIG'
          lxc.rootfs.path = /var/lib/lxc/test-container/rootfs
          lxc.uts.name = test-container
          lxc.net.0.type = veth
          lxc.net.0.flags = up
          lxc.net.0.link = lxcbr0
          LXC_CONFIG
          
          # Start and test
          lxc-start -n "$CONTAINER_NAME" -d
          sleep 2
          lxc-attach -n "$CONTAINER_NAME" -- mmdebstrap --version
          lxc-stop -n "$CONTAINER_NAME"
          lxc-destroy -n "$CONTAINER_NAME" -f
          
          echo "=== LXC tests passed ==="
          EOF
          
          # Script 3: QEMU VM test (full system emulation)
          cat << 'EOF' > test-with-qemu.sh
          #!/bin/bash
          # Create bootable QEMU image and test
          # Usage: ./test-with-qemu.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          echo "=== Creating QEMU image from rootfs ==="
          
          # Install dependencies if needed
          if ! command -v qemu-system-x86_64 &> /dev/null; then
            sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          fi
          
          # Extract
          mkdir -p qemu-test/rootfs
          tar -xJf "$ARTIFACT" -C qemu-test/rootfs
          
          # Create disk image
          cd qemu-test
          qemu-img create -f raw disk.img 2G
          
          # Setup partition
          sudo parted -s disk.img mklabel msdos
          sudo parted -s disk.img mkpart primary ext4 1MiB 100%
          sudo parted -s disk.img set 1 boot on
          
          LOOP_DEV=$(sudo losetup --find --show --partscan disk.img)
          sudo mkfs.ext4 -F "${LOOP_DEV}p1"
          
          MOUNT_DIR=$(mktemp -d)
          sudo mount "${LOOP_DEV}p1" "$MOUNT_DIR"
          sudo cp -a rootfs/. "$MOUNT_DIR/"
          
          # Configure boot
          sudo mkdir -p "$MOUNT_DIR/boot/extlinux"
          sudo chroot "$MOUNT_DIR" apt-get install -y --no-install-recommends linux-image-amd64 extlinux
          
          KERNEL=$(sudo ls "$MOUNT_DIR/boot/vmlinuz-"* | head -1 | xargs basename)
          INITRD=$(sudo ls "$MOUNT_DIR/boot/initrd.img-"* | head -1 | xargs basename)
          
          sudo tee "$MOUNT_DIR/boot/extlinux/extlinux.conf" << EXT
          DEFAULT debian
          LABEL debian
                LINUX /boot/$KERNEL
                INITRD /boot/$INITRD
                APPEND root=/dev/vda1 console=ttyS0 rw
          EXT
          
          sudo extlinux --install "$MOUNT_DIR/boot/extlinux"
          sudo dd if=/usr/lib/syslinux/mbr.bin of="${LOOP_DEV}" bs=440 count=1
          
          sudo tee "$MOUNT_DIR/etc/fstab" << FSTAB
          /dev/vda1 / ext4 defaults 0 1
          proc /proc proc defaults 0 0
          FSTAB
          
          # Unmount
          sudo umount "$MOUNT_DIR"
          sudo losetup -d "$LOOP_DEV"
          rmdir "$MOUNT_DIR"
          
          # Run QEMU
          echo "=== Starting QEMU VM ==="
          echo "Login: root (no password)"
          echo "Run 'mmdebstrap --version' to test"
          echo "Press Ctrl+A X to exit"
          
          qemu-system-x86_64 \
            -machine accel=kvm:tcg \
            -m 1024 \
            -drive file=disk.img,format=raw,if=virtio \
            -nographic \
            -serial mon:stdio
          
          cd ..
          rm -rf qemu-test
          
          echo "=== QEMU tests completed ==="
          EOF
          
          # Script 4: Quick validation (no emulation)
          cat << 'EOF' > validate-rootfs.sh
          #!/bin/bash
          # Quick validation of rootfs contents (no emulation)
          # Usage: ./validate-rootfs.sh rootfs.tar.xz
          
          set -e
          
          ARTIFACT="${1:-rootfs.tar.xz}"
          
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: $ARTIFACT not found"
            echo "Usage: $0 <rootfs.tar.xz>"
            exit 1
          fi
          
          echo "=== Validating rootfs ==="
          
          TEMP_DIR=$(mktemp -d)
          tar -xJf "$ARTIFACT" -C "$TEMP_DIR"
          
          echo "Checking essential files..."
          [ -f "$TEMP_DIR/bin/bash" ] && echo "✓ bash present"
          [ -f "$TEMP_DIR/usr/bin/apt" ] && echo "✓ apt present"
          [ -f "$TEMP_DIR/usr/bin/mmdebstrap" ] && echo "✓ mmdebstrap present"
          [ -L "$TEMP_DIR/bin/sh" ] && echo "✓ /bin/sh symlink present"
          [ -d "$TEMP_DIR/etc/apt" ] && echo "✓ /etc/apt present"
          
          # Check library dependencies
          if command -v ldd &> /dev/null; then
            ldd "$TEMP_DIR/bin/bash" | grep -q "libc.so" && echo "✓ bash libraries OK"
          fi
          
          rm -rf "$TEMP_DIR"
          
          echo "=== Validation completed ==="
          EOF
          
          chmod +x test-with-docker.sh test-with-lxc.sh test-with-qemu.sh validate-rootfs.sh
          
          echo "=== Local testing scripts created ==="
      
      # ============================================
      # Step 7: Upload testing scripts
      # ============================================
      - name: Upload testing scripts
        uses: actions/upload-artifact@v4
        with:
          name: testing-scripts
          path: |
            test-with-docker.sh
            test-with-lxc.sh
            test-with-qemu.sh
            validate-rootfs.sh
          retention-days: 1
      
      # ============================================
      # Step 8: Generate checksums
      # ============================================
      - name: Generate checksums
        run: |
          sha256sum rootfs.tar.xz > checksums.txt
          sha256sum test-with-docker.sh >> checksums.txt
          sha256sum test-with-lxc.sh >> checksums.txt
          sha256sum test-with-qemu.sh >> checksums.txt
          sha256sum validate-rootfs.sh >> checksums.txt
          
          echo "=== Checksums ==="
          cat checksums.txt
      
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt
          retention-days: 1
      
      # ============================================
      # Step 9: Cleanup
      # ============================================
      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf "${{ github.workspace }}/rootfs"
          echo "Cleanup completed"
      
      # ============================================
      # Step 10: Summary
      # ============================================
      - name: Build summary
        run: |
          echo "========================================"
          echo "Build Summary"
          echo "========================================"
          echo "✓ cdebootstrap-static installed"
          echo "✓ Debian rootfs created with mmdebstrap"
          echo "✓ Rootfs validated (7 basic checks passed)"
          echo "✓ Rootfs archived with xz compression"
          echo "========================================"
          echo ""
          echo "Artifacts available (retention: 1 day):"
          echo "  - debian-rootfs-tarball.tar.xz"
          echo "  - testing-scripts (Docker, LXC, QEMU)"
          echo "  - checksums.txt"
          echo ""
          echo "Local testing options:"
          echo "  1. Quick validation:"
          echo "     ./validate-rootfs.sh rootfs.tar.xz"
          echo ""
          echo "  2. Docker test:"
          echo "     ./test-with-docker.sh rootfs.tar.xz"
          echo ""
          echo "  3. LXC test (requires root):"
          echo "     sudo ./test-with-lxc.sh rootfs.tar.xz"
          echo ""
          echo "  4. QEMU full VM test:"
          echo "     ./test-with-qemu.sh rootfs.tar.xz"
          echo "========================================"
